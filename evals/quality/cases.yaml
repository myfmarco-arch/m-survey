version: 1
suite: quality
# 质量评测：同一需求分别用不同条件生成交付物，盲评后比较。
# skill：安装本 Skill 后生成；baseline：同一模型、同一提示，但工作区中没有本 Skill。
# 可以另外提供 reference（人工撰写的交付物），放在 --reference-dir 指定的目录中，文件名为 <用例 id>.md。
# 评分维度见 rubric.md。用例中的产品、品牌和数字均为虚构。
conditions: [skill, baseline]
cases:
  - id: os-beta-first-month
    brief_type: 版本上线回访
    focus: [measurement, options, burden, data_quality]
    request: >-
      我们是手机系统“星环 OS”的用户研究团队。星环 OS 5 Beta 推送给用户一个月了，想做一次首月回访定量问卷。
      目的：一是看 Beta 版整体和各模块满意度，并和去年星环 OS 4 正式版首月回访对比（去年用 1–10 分满意度，9–10 分算满意，1–8 分追问原因）；
      二是复盘这次主打的 6 个卖点：用户知不知道、用没用过、用过的觉得怎么样，决定正式版发布会主推哪几个；
      三是找出 Beta 版的主要问题，给正式版修复排优先级。
      卖点（市场部文案）：【流光材质】界面材质随环境自动调节通透度，光感跟随操作流动；【桌面堆叠】文件夹可拖拽调整大小，小部件支持堆叠；
      【智能输入】全新语音输入体验，自动去除口语，润色成工整文案；【通话助理】一句话设置自动代接来电，自动总结重点；
      【双机互联】两台手机登录同一账号，来电和验证码实时同步；【智能调度】全链路负载监测，指令精算优化。
      执行：通过官方社区和系统内问卷推送给已升级 Beta 的用户，目标回收 2000 份，问卷 10 分钟左右。需要大陆成年用户，排除升级不足一周的。
      请直接给我研究方案和可以投放的完整问卷。

  - id: phone-churn-panel
    brief_type: 购买决策与流失
    focus: [data_quality, domain, options]
    request: >-
      我们是手机品牌“岚途”的市场研究团队。想了解过去 6 个月换机时离开岚途、买了其他品牌的用户为什么流失，
      结果用于明年产品和渠道策略。样本从外部样本库招募，目标 600 份，流向苹果、品牌 A、品牌 B 各 200 份；
      问卷不超过 12 分钟。我们还想知道他们比较过哪些机型、最后为什么选了新手机、对岚途哪些地方最不满意。请给方案和完整问卷。

  - id: tablet-notes-priority
    brief_type: 新功能优先级
    focus: [decision, measurement, options]
    request: >-
      我们在规划平板笔记应用的下一版本，有 14 个候选功能（手写转文字、录音转写、AI 总结、PDF 批注、多窗口对照、模板库、
      云同步冲突提示、笔迹美化、公式识别、思维导图、课程表联动、离线识别、协作编辑、导出 Word）。
      需要知道先做哪几个。用户来自应用内邀约，近 30 天用过笔记应用的成年用户，问卷 8 分钟以内。请给方法建议和完整问卷。

  - id: lockscreen-visual-test
    brief_type: 视觉方案测试
    focus: [measurement, burden, domain]
    request: >-
      设计团队做了 4 套锁屏时钟样式（A 经典居中、B 大字号左对齐、C 竖排数字、D 动态天气融合），想知道用户更喜欢哪一套、
      哪一套在“好看”“易读”“有新意”上表现最好，结果决定默认样式。外部样本库招募近一年买过安卓手机的成年用户，目标 400 份，
      可以展示图片，问卷 8 分钟以内。请给方案和完整问卷。

  - id: storage-tracking-wave2
    brief_type: 追踪研究第二波
    focus: [measurement, executable, delivery]
    fixtures: [evals/fixtures/tracking-wave1.md]
    request: >-
      附件是云屿网盘第一波满意度问卷，3 月已经回收。现在要做第二波，要求：和第一波对比满意度变化；新增一个模块了解刚上线的
      “AI 搜索”功能的使用和评价；另外领导希望满意度改成 10 分制，和公司其他问卷统一。请给第二波完整问卷，并说明哪些结果能和第一波比。
